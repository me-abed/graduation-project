<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #080b1f;
      --bg-2: #11173a;
      --card: rgba(20, 27, 60, 0.58);
      --line: rgba(130, 170, 255, 0.35);
      --txt-main: #f4f8ff;
      --txt-sub: #b8c4e9;
      --accent: #6cf2ff;
      --accent-2: #8f7bff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Saira", sans-serif;
      color: var(--txt-main);
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(108, 242, 255, 0.15), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(143, 123, 255, 0.2), transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: rgba(8, 11, 31, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .site-nav a,
    .site-nav .auth-logout {
      text-decoration: none;
      color: var(--txt-sub);
      font-weight: 500;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: 0.2s ease;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
    }

    .site-nav a:hover,
    .site-nav .auth-logout:hover {
      color: var(--txt-main);
      border-color: rgba(130, 170, 255, 0.4);
    }

    .site-nav a.active {
      color: var(--accent);
      border-color: var(--line);
    }

    .site-nav [data-auth-nav] { display: contents; }

    .page {
      min-height: 100vh;
      padding: 88px 16px 32px;
      display: grid;
      place-items: center;
    }

    .panel {
      width: min(520px, 100%);
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: clamp(28px, 5vw, 40px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.35rem, 3vw, 1.75rem);
    }

    p {
      margin: 0 0 24px;
      color: var(--txt-sub);
      line-height: 1.55;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #071026;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(111, 150, 255, 0.35);
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main">
    <a href="../index.html">Home</a>
    <a href="../create/index.html" class="auth-gated" hidden>Create</a>
    <a href="../my-transfers/index.html" class="auth-gated" hidden>My Transfers</a>
    <div data-auth-nav>
      <a class="auth-signup" href="../signup/index.html">Sign Up</a>
      <a class="auth-login" href="../login/index.html">Log In</a>
      <button type="button" class="auth-logout" hidden>Sign Out</button>
    </div>
  </nav>

  <main class="page">
    <section class="panel">
      <h1>3D Model Viewer</h1>
      <p>Open a transfer from My Transfers to view or download your generated 3D model.</p>
      <a class="btn auth-gated" href="../my-transfers/index.html" hidden>Go to My Transfers</a>
      <a class="btn auth-login-link" href="../login/index.html">Log in to continue</a>
    </section>
  </main>

  <script src="../assets/js/auth-api.js"></script>
  <script src="../assets/js/auth-nav.js"></script>
  <script>
    (function () {
      const transfersBtn = document.querySelector(".auth-gated.btn");
      const loginLink = document.querySelector(".auth-login-link");
      if (AuthApi.isLoggedIn()) {
        if (transfersBtn) transfersBtn.hidden = false;
        if (loginLink) loginLink.style.display = "none";
      }
    })();
  </script>
</body>
</html>
